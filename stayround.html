<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<link rel="manifest" href="stayround-manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="stayround-icon-192.png">
<link rel="apple-touch-icon" href="stayround-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="거래처 관리">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>거래처 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@200;300;400;500;600&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#FBF6EE;        /* 바탕 — 따뜻한 아이보리 */
  --ink2:#FFFFFF;       /* 패널 */
  --ink3:#F6EEE1;       /* 융기면 */
  --line:#E8DCCB;       /* 괘선 */
  --brass:#E8623A;      /* 포인트 — 동백 코랄 */
  --brass-lo:#B4714E;
  --paper:#2E2A26;      /* 글자 */
  --dim:#8A8074;
  --tide:#1FA089;       /* 양호 */
  --amber:#E39A1B;      /* 주의 */
  --signal:#D8453B;     /* 문제 · 기한 초과 */
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:'IBM Plex Sans KR',system-ui,sans-serif;
  font-weight:400;
  font-size:15px;line-height:1.6;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(226,212,192,.38) 1px,transparent 1px),
    linear-gradient(90deg,rgba(226,212,192,.38) 1px,transparent 1px);
  background-size:44px 44px;
  background-attachment:fixed;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ── 상단 ───────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 18px 12px;
  background:linear-gradient(var(--ink) 72%,rgba(251,246,238,0));
  backdrop-filter:blur(6px);
}
.wordmark{display:flex;align-items:baseline;gap:9px}
.wordmark .kr{font-family:'Song Myung',serif;font-size:21px;letter-spacing:.06em;color:var(--brass)}
.wordmark .lat{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.syncpill{
  display:flex;align-items:center;gap:7px;
  padding:6px 11px;border:1px solid var(--line);border-radius:999px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--dim);
}
.syncpill .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.syncpill.live .dot{background:var(--tide);box-shadow:0 0 0 3px rgba(79,166,160,.18)}
.syncpill.local .dot{background:var(--brass)}

main{padding:4px 18px 24px;max-width:1080px;margin:0 auto}

/* ── 공통 조판 ──────────────────────── */
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--brass-lo);margin:0 0 10px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h1.screen{font-size:26px;font-weight:300;letter-spacing:-.01em;margin:2px 0 4px}
.sub{color:var(--dim);font-size:13px;margin:0}
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 2px 12px rgba(150,110,60,.06)}
.section{margin:30px 0 0}
.empty{
  border:1px dashed var(--line);border-radius:var(--r);
  padding:30px 20px;text-align:center;color:var(--dim);font-size:13.5px;
}
.empty strong{display:block;color:var(--paper);font-weight:400;font-size:15px;margin-bottom:6px}

/* ── 계기판(hero) ───────────────────── */
.hero{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:20px 0 22px;margin-top:8px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
.hero .date{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--dim)}
.hero .head{font-size:23px;font-weight:300;line-height:1.35;margin:8px 0 0;max-width:22ch}
.hero .head b{font-weight:500;color:var(--brass)}
.hero .counts{display:flex;gap:22px}
.count .n{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;line-height:1}
.count .l{font-size:11px;color:var(--dim);letter-spacing:.04em;margin-top:5px}
.count.due .n{color:var(--signal)}
.count.soon .n{color:var(--amber)}
.count.ok .n{color:var(--tide)}

/* ── 다이얼 그리드 ──────────────────── */
.dials{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px 4px}
.dial{padding:12px 4px 14px;border-radius:12px;text-align:center;transition:background .15s}
.dial:hover{background:rgba(246,238,225,.9)}
.dial:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.dial svg{display:block;margin:0 auto}
.dial .val{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;fill:var(--paper)}
.dial .unit{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;fill:var(--dim)}
.dial .nm{font-size:12.5px;margin-top:9px;line-height:1.3;word-break:keep-all}
.dial .st{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--dim);margin-top:3px}
.dial.over .st{color:var(--signal)}
.dial.soon .st{color:var(--amber)}

/* ── 목록 행 ────────────────────────── */
.row{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:14px 2px;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none}
.row .bar{width:2px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.row.b-signal .bar{background:var(--signal)}
.row.b-amber .bar{background:var(--amber)}
.row.b-tide .bar{background:var(--tide)}
.row .body{flex:1;min-width:0}
.row .t{font-size:14px;line-height:1.4;word-break:break-word}
.row .m{font-size:11.5px;color:var(--dim);margin-top:3px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.row .end{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);flex:none;text-align:right}

/* ── 버튼 ───────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink3);font-size:13.5px;font-weight:400;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:500}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(216,69,59,.5);color:#D8453B;background:transparent}
.btn.wide{width:100%}
a.btn{text-decoration:none}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--dim);
}
.chip.on{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:500}

/* ── 하단 레일 ──────────────────────── */
.rail{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;
  display:flex;gap:2px;padding:5px;
  background:rgba(255,255,255,.96);border:1px solid var(--line);
  border-radius:999px;backdrop-filter:blur(10px);
  box-shadow:0 8px 26px rgba(140,100,50,.18);
}
.rail{max-width:calc(100vw - 12px);overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{
  padding:9px 8px;border-radius:999px;font-size:12.5px;color:var(--dim);
  display:flex;align-items:center;gap:4px;white-space:nowrap;
}
@media(min-width:430px){.rail button{padding:9px 13px}}
.rail button.on{background:var(--brass);color:#fff;font-weight:500}
.rail .badge{
  font-family:'IBM Plex Mono',monospace;font-size:9px;padding:1px 5px;border-radius:999px;
  background:var(--signal);color:#fff;
}
.rail button.on .badge{background:#fff;color:var(--brass)}

/* ── 점검 모드 ──────────────────────── */
.runwrap{position:fixed;inset:0;z-index:70;background:var(--ink);display:flex;flex-direction:column}
.runtop{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.runtop .l1{display:flex;justify-content:space-between;align-items:center;gap:12px}
.runtop .site{font-size:13px;color:var(--dim)}
.runtop .idx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass);letter-spacing:.08em}
.progress{height:2px;background:var(--line);margin-top:11px;border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brass);transition:width .25s ease}
.runbody{flex:1;overflow-y:auto;padding:26px 20px 12px;max-width:640px;width:100%;margin:0 auto}
.qcard{animation:slidein .22s ease}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qgroup{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;color:var(--brass-lo);text-transform:uppercase}
.qtext{font-size:24px;font-weight:300;line-height:1.45;margin:14px 0 6px;word-break:keep-all}
.qhint{font-size:12.5px;color:var(--dim);line-height:1.6}
.qhint.warnbox{border-left:2px solid var(--signal);padding-left:11px;margin-top:14px}
.qnote{
  width:100%;margin-top:18px;background:var(--ink2);border:1px solid var(--line);
  border-radius:10px;padding:12px;min-height:74px;resize:vertical;font-size:13.5px;
}
.qnote::placeholder{color:#B5AB9D}
.answers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:20px}
.ans{padding:16px 6px;border-radius:12px;border:1px solid var(--line);background:var(--ink2);text-align:center}
.ans .k{display:block;font-size:15px;font-weight:400}
.ans .d{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);margin-top:5px;letter-spacing:.08em}
.ans.ok.on{border-color:var(--tide);background:rgba(79,166,160,.16)}
.ans.warn.on{border-color:var(--amber);background:rgba(224,163,46,.16)}
.ans.bad.on{border-color:var(--signal);background:rgba(196,69,61,.16)}
.ans.on .d{color:var(--paper)}
.runfoot{
  padding:12px 18px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;
  max-width:640px;width:100%;margin:0 auto;
}
.runfoot .btn{flex:1}

/* ── 모달 ───────────────────────────── */
.mask{position:fixed;inset:0;z-index:80;background:rgba(70,50,30,.35);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.mask{align-items:center}}
.sheet{
  background:var(--ink2);border:1px solid var(--line);
  border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  animation:up .2s ease;
}
@media(min-width:640px){.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:19px;font-weight:500;margin:0 0 16px}
.field{margin-bottom:14px}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--brass-lo);text-transform:uppercase;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;font-size:14px;
}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--dim);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.field input::placeholder,.field textarea::placeholder{color:#B5AB9D}
.occbar{height:4px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden}
.occbar i{display:block;height:100%;border-radius:2px}
.bignum{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;line-height:1;text-align:right}
.bignum small{display:block;font-size:9px;letter-spacing:.1em;color:var(--dim);margin-top:4px;font-weight:400}
.stack{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex:none}
.notecard{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-bottom:14px}
.notecard .d{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-lo);letter-spacing:.08em}
.calcline{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-lo);margin-top:6px;text-align:center;letter-spacing:.03em;min-height:14px}
.calcline.full{color:var(--tide)}
.notecard .x{font-size:13.5px;white-space:pre-wrap;margin-top:4px;word-break:break-word}
.prevcard{background:var(--ink3);border-radius:10px;padding:11px 13px;margin-bottom:16px;font-size:13px;line-height:1.65;word-break:break-word}
.prevcard .d{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-lo);letter-spacing:.06em;margin-bottom:3px}
.typetag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass-lo);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:4px;white-space:nowrap}

/* ── 아코디언(변경 이력) ────────────── */
.acc{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:12px 2px;display:flex;align-items:center;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc .v{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass)}
.acc .d{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);margin-left:auto}
.acc ul{margin:0 0 14px;padding-left:18px;font-size:13px;color:var(--dim);line-height:1.75}
.tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--brass);color:#fff}

/* ── 토스트 ─────────────────────────── */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(86px + env(safe-area-inset-bottom));z-index:99;
  background:var(--paper);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:400;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl .node{position:relative;padding:10px 0}
.tl .node::before{content:"";position:absolute;left:-19px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--brass);border:2px solid var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wordmark"><span class="kr">거래처 관리</span><span class="lat">Stay U</span></div>
  <button class="syncpill local" id="syncPill"><span class="dot"></span><span id="syncTxt">로컬 저장</span></button>
</header>

<main id="screen"></main>

<nav class="rail" id="rail"></nav>
<div id="modalRoot"></div>
<div id="toast"></div>

<script src="config.js" onerror="window.__noConfig=true"></script>
<script>

function dayDiff(a,b){ // b - a (일)
  const x=new Date(a+'T00:00:00'), y=new Date(b+'T00:00:00');
  return Math.round((y-x)/86400000);
}
function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso+'T00:00:00');
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}
function addDays(iso,n){
  const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return fmtISO(d);
}

function blankDB(){
  return { sites:[], visits:[], issues:[], reports:[], notes:[], templates:defaultTemplates(), draft:null, meta:{ version:APP_VERSION, updatedAt:0 } };   // 0 = 아직 아무것도 저장 안 한 새 기기 → 서버 데이터를 먼저 받는다
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const p = JSON.parse(raw); return normalize(p); }
  }catch(e){ console.warn('로컬 데이터 읽기 실패', e); }
  return blankDB();
}
function normalize(p){
  const b = blankDB();
  const tpls = (Array.isArray(p.templates)&&p.templates.length)?p.templates:b.templates;
  if(!tpls.some(t=>t.id==='tpl_food')) tpls.push(defaultTemplates().find(t=>t.id==='tpl_food'));
  return {
    sites: Array.isArray(p.sites)?p.sites:b.sites,
    visits: Array.isArray(p.visits)?p.visits:b.visits,
    issues: Array.isArray(p.issues)?p.issues:b.issues,
    reports: Array.isArray(p.reports)?p.reports:b.reports,
    notes: Array.isArray(p.notes)?p.notes:b.notes,
    templates: tpls,
    draft: p.draft||null,
    meta: Object.assign({},b.meta,p.meta||{})
  };
}
function save(){
  DB.meta.updatedAt = Date.now();
  DB.meta.version = APP_VERSION;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ toast('저장 공간이 부족합니다'); }
  if(remote && !applyingRemote){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      remote.set(JSON.parse(JSON.stringify({sites:DB.sites,visits:DB.visits,issues:DB.issues,reports:DB.reports,notes:DB.notes,templates:DB.templates,meta:DB.meta})))
        .then(()=>setSync('live','동기화 중'))
        .catch(err=>{ console.warn(err); setSync('local','동기화 실패'); toast('동기화 실패 — 이 기기에는 저장됐습니다'); });
    }, 700);
  }
}

/* ── 선택적 Firebase 동기화 ─────────── */
// config.js는 StayScan과 같은 파일을 함께 쓴다 (window.STAYSCAN_FIREBASE)
const fbConfig = () => window.STAYROUND_FIREBASE || window.STAYSCAN_FIREBASE || window.firebaseConfig || null;
function initSync(){
  const cfg = fbConfig();
  if(!cfg){ setSync('local','로컬 저장'); return; }
  const load = (src)=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  setSync('','연결 중');
  load('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js')
    .then(()=>load('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js'))
    .then(()=>{
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      remote = firebase.firestore().collection('stayround').doc('db');
      remote.onSnapshot(snap=>{
        if(!snap.exists){ save(); setSync('live','동기화 중'); return; }
        const d = snap.data();
        if(d && d.meta && d.meta.updatedAt && d.meta.updatedAt > (DB.meta.updatedAt||0)){
          applyingRemote = true;
          const draft = DB.draft;
          DB = normalize(d); DB.draft = draft;
          try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){}
          applyingRemote = false;
          render();
        }
        setSync('live','동기화 중');
      },err=>{ console.warn(err); setSync('local','로컬 저장'); });
    })
    .catch(()=>setSync('local','로컬 저장'));
}

/* ── 파생 계산 ──────────────────────── */
function siteStatus(s){
  const t = todayISO(), cyc = s.cycleDays||30;
  // 다음 방문 예정일이 최근 방문일보다 뒤에 잡혀 있으면 그 날짜가 기준
  const planned = (s.nextVisit && (!s.lastVisit || s.nextVisit > s.lastVisit)) ? s.nextVisit : null;
  if(!s.lastVisit && !planned) return { state:'never', left:null, pct:1, label:'미방문' };
  const due = planned || addDays(s.lastVisit, cyc);
  const left = dayDiff(t, due);              // 남은 일수 (음수면 초과)
  const base = s.lastVisit || addDays(due, -cyc);
  const span = Math.max(1, dayDiff(base, due));
  const elapsed = dayDiff(base, t);
  const pct = Math.max(0, Math.min(1.6, elapsed/span));
  let state='ok';
  if(left < 0) state='over'; else if(left <= 3) state='soon';
  return { state, left, pct, due, elapsed, label: left<0 ? `${-left}일 초과` : (left===0?'오늘':`D-${left}`) };
}
function formatPhone(v){
  const d = String(v||'').replace(/\D/g,'').slice(0,11);
  if(!d) return '';
  if(d.startsWith('02')){
    if(d.length<3) return d;
    if(d.length<6) return d.slice(0,2)+'-'+d.slice(2);
    if(d.length<10) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5,9);
    return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
  }
  if(d.length<4) return d;
  if(d.length<8) return d.slice(0,3)+'-'+d.slice(3);
  if(d.length<11) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6,10);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11);
}
const numOrNull = v => { const n=parseFloat(String(v==null?'':v).replace(/[^\d.]/g,'')); return isNaN(n)?null:n; };
const won = v => v==null?'—':Number(v).toLocaleString('ko-KR')+'원';
const pctTxt = v => v==null?'—':v+'%';

const trendColor = v => v==='늘었음'?'var(--tide)':v==='줄었음'?'var(--signal)':'var(--amber)';
function latestReport(siteId){

function occHead(r){
  if(!r) return null;
  const v=[r.occWeek,r.occToday,r.occMonth].find(x=>x!=null);
  return v==null?null:v;
}
function daysInMonth(iso){
  const y=+String(iso).slice(0,4), m=+String(iso).slice(5,7);
  if(!y||!m) return 30;
  return new Date(y, m, 0).getDate();
}
function denoms(rooms, dateISO){
  if(!rooms) return { Today:null, Week:null, Month:null };
  return { Today:rooms, Week:rooms*7, Month:rooms*daysInMonth(dateISO) };
}
function occTxt(r, key){
  const p = r['occ'+key], rm = r['rm'+key];
  if(p==null && rm==null) return '—';
  const unit = key==='Today' ? '실' : '실박';
  if(rm==null) return p+'%';
  return (p==null?'':p+'% ') + '(' + rm + unit + ')';
}
function occBar(p){
  if(p==null) return '';
  const v=Math.max(0,Math.min(100,p));
  const col = v>=70?'var(--tide)':v>=40?'var(--amber)':'var(--signal)';
  return `<div class="occbar"><i style="width:${v}%;background:${col}"></i></div>`;
}
const isEndedId = id => { const s = DB.sites.find(x=>x.id===id); return !!(s && s.ended); };
const liveSites = () => DB.sites.filter(s=>!s.ended);
const endedSites = () => DB.sites.filter(s=>s.ended);
const openIssues = siteId => DB.issues.filter(i=>i.status!=='done' && (siteId ? i.siteId===siteId : !isEndedId(i.siteId)));
const siteById = id => DB.sites.find(s=>s.id===id);
const tplById = id => DB.templates.find(t=>t.id===id) || DB.templates[0];
function sortedSites(){
  return liveSites().sort((a,b)=>{
    const A=siteStatus(a), B=siteStatus(b);
    const av = A.left===null?-9999:A.left, bv = B.left===null?-9999:B.left;
    return av-bv;
  });
}

/* ── 다이얼 SVG ─────────────────────── */
function dialSVG(st){
  const R=30, C=2*Math.PI*R;
  const col = st.state==='over'?'var(--signal)':st.state==='soon'?'var(--amber)':st.state==='never'?'var(--brass-lo)':'var(--tide)';
  const p = Math.min(1, st.pct);
  const val = st.left===null ? '—' : (st.left<0 ? `+${-st.left}` : String(st.left));
  const unit = st.left===null ? '미방문' : (st.left<0?'일 초과':'일 남음');
  return `<svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
    <circle cx="40" cy="40" r="${R}" fill="none" stroke="var(--line)" stroke-width="3"/>
    <circle cx="40" cy="40" r="${R}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 40 40)"/>
    <line x1="40" y1="6" x2="40" y2="11" stroke="var(--brass)" stroke-width="1.5"/>
    <text class="val" x="40" y="42" text-anchor="middle">${val}</text>
    <text class="unit" x="40" y="54" text-anchor="middle">${unit}</text>
  </svg>`;
}

/* ── 점검 진행 ──────────────────────── */
let RUN = null;
function buildQueue(site){
  const tpl = tplById(site.templateId);
  const q = [];
  openIssues(site.id).forEach(i=>{
    q.push({ kind:'issue', issueId:i.id, group:'지난 지적사항', text:i.text, hint:i.note||'' });
  });
  tpl.groups.forEach(g=> g.items.forEach(txt=> q.push({ kind:'item', group:g.name, text:txt })));
  return q;
}
function startRun(siteId, resumeDraft){
  const site = siteById(siteId); if(!site) return;
  RUN = { siteId, queue:buildQueue(site), i:0, answers:{}, summary:'' };
  if(resumeDraft && resumeDraft.siteId===siteId){
    RUN.answers = resumeDraft.answers||{};
    RUN.summary = resumeDraft.summary||'';
    const firstUn = RUN.queue.findIndex((q,idx)=>!RUN.answers[idx]);
    RUN.i = firstUn<0 ? RUN.queue.length : firstUn;
  }
  drawRun();
}
function saveDraft(){
  if(!RUN) return;
  DB.draft = { siteId:RUN.siteId, answers:RUN.answers, summary:RUN.summary, answered:Object.keys(RUN.answers).length, at:Date.now() };
  save();
}
function drawRun(){
  let w = document.getElementById('runwrap');
  if(!w){ w=document.createElement('div'); w.id='runwrap'; w.className='runwrap'; document.body.appendChild(w); }
  document.getElementById('rail').style.display='none';
  const site = siteById(RUN.siteId);
  const total = RUN.queue.length;

  if(RUN.i >= total){ w.innerHTML = runSummary(site); return; }

  const q = RUN.queue[RUN.i];
  const a = RUN.answers[RUN.i] || {};
  w.innerHTML = `
  <div class="runtop">
    <div class="l1">
      <div class="site">${esc(site.name)}</div>
      <div class="idx mono">${String(RUN.i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
    </div>
    <div class="progress"><i style="width:${(RUN.i/total*100).toFixed(1)}%"></i></div>
  </div>
  <div class="runbody">
    <div class="qcard">
      <div class="qgroup">${esc(q.group)}</div>
      <div class="qtext">${esc(q.text)}</div>
      ${q.kind==='issue'
        ? `<div class="qhint warnbox">지난 방문에서 남긴 조치입니다. 해결됐으면 <b>양호</b>를 누르면 조치 목록에서 자동으로 닫힙니다.${q.hint?'<br>메모: '+esc(q.hint):''}</div>`
        : ''}
      <div class="answers">
        <button class="ans ok ${a.status==='ok'?'on':''}" data-ans="ok"><span class="k">양호</span><span class="d mono">OK</span></button>
        <button class="ans warn ${a.status==='warn'?'on':''}" data-ans="warn"><span class="k">주의</span><span class="d mono">WATCH</span></button>
        <button class="ans bad ${a.status==='bad'?'on':''}" data-ans="bad"><span class="k">문제</span><span class="d mono">ACTION</span></button>
      </div>
      <textarea class="qnote" id="qnote" placeholder="메모 — 주의·문제를 고르면 이 내용이 조치 목록으로 넘어갑니다">${esc(a.note||'')}</textarea>
      <div style="margin-top:10px"><button class="btn ghost sm" data-ans="na">해당 없음 · 건너뛰기</button></div>
    </div>
  </div>
  <div class="runfoot">
    <button class="btn ghost" data-run="prev" ${RUN.i===0?'disabled style="opacity:.4"':''}>이전</button>
    <button class="btn ghost" data-run="quit">중단</button>
    <button class="btn" data-run="next">다음</button>
  </div>`;
}
function answer(status){
  const note = (document.getElementById('qnote')||{}).value||'';
  RUN.answers[RUN.i] = { status, note:note.trim(), text:RUN.queue[RUN.i].text, group:RUN.queue[RUN.i].group, kind:RUN.queue[RUN.i].kind, issueId:RUN.queue[RUN.i].issueId };
  RUN.i++; saveDraft(); drawRun();
}
function runSummary(site){
  const vals = Object.values(RUN.answers);
  const c = k => vals.filter(v=>v.status===k).length;
  const bads = vals.filter(v=>(v.status==='bad'||v.status==='warn'));
  return `
  <div class="runtop"><div class="l1"><div class="site">${esc(site.name)}</div><div class="idx mono">기록 완료</div></div>
  <div class="progress"><i style="width:100%"></i></div></div>
  <div class="runbody">
    <div class="qgroup">방문 요약</div>
    <div class="qtext" style="font-size:21px">${fmtDate(todayISO())} 점검 결과</div>
    <div class="counts" style="display:flex;gap:26px;margin:18px 0 6px">
      <div class="count ok"><div class="n mono">${c('ok')}</div><div class="l">양호</div></div>
      <div class="count soon"><div class="n mono">${c('warn')}</div><div class="l">주의</div></div>
      <div class="count due"><div class="n mono">${c('bad')}</div><div class="l">문제</div></div>
    </div>
    ${bads.length?`<div class="panel" style="margin-top:18px;padding:4px 16px">
      ${bads.map(v=>`<div class="row b-${v.status==='bad'?'signal':'amber'}"><div class="bar"></div>
        <div class="body"><div class="t">${esc(v.text)}</div>${v.note?`<div class="m">${esc(v.note)}</div>`:''}</div></div>`).join('')}
    </div>
    <p class="sub" style="margin-top:10px">위 항목은 저장과 동시에 조치 목록에 등록됩니다.</p>`
    :`<p class="sub" style="margin-top:14px">새로 등록될 조치가 없습니다.</p>`}
    <div class="field" style="margin-top:20px">
      <label>총평</label>
      <textarea id="runsummary" placeholder="사장님 면담 내용, 다음 방문 때 챙길 것 등">${esc(RUN.summary||'')}</textarea>
    </div>
  </div>
  <div class="runfoot">
    <button class="btn ghost" data-run="back">뒤로</button>
    <button class="btn primary" data-run="save">방문 기록 저장</button>
  </div>`;
}
function commitRun(){
  const site = siteById(RUN.siteId);
  const summary = (document.getElementById('runsummary')||{}).value||'';
  const visitId = uid(), date = todayISO();
  const results = Object.values(RUN.answers);

  results.forEach(v=>{
    if(v.kind==='issue' && v.issueId){
      const iss = DB.issues.find(x=>x.id===v.issueId);
      if(iss){
        if(v.status==='ok'){ iss.status='done'; iss.closedAt=date; }
        else if(v.status!=='na'){ iss.status='doing'; if(v.note) iss.note=v.note; iss.lastSeen=date; }
      }
      return;
    }
    if(v.status==='bad'||v.status==='warn'){
      DB.issues.push({ id:uid(), siteId:site.id, visitId, text:v.text, note:v.note||'',
        level:v.status, status:'open', createdAt:date });
    }
  });

  DB.visits.push({ id:visitId, siteId:site.id, date, summary:summary.trim(),
    counts:{ ok:results.filter(r=>r.status==='ok').length, warn:results.filter(r=>r.status==='warn').length,
             bad:results.filter(r=>r.status==='bad').length, na:results.filter(r=>r.status==='na').length },
    results: results.map(r=>({text:r.text,group:r.group,status:r.status,note:r.note})) });

  site.lastVisit = date;
  DB.draft = null;
  save();
  endRun();
  toast('방문 기록을 저장했습니다');
  go('board');
}
function endRun(){
  RUN=null;
  const w=document.getElementById('runwrap'); if(w) w.remove();
  document.getElementById('rail').style.display='';
}

  if(r.occToday!=null||r.rmToday!=null) a.push('당일 '+occTxt(r,'Today'));
  if(r.occWeek!=null||r.rmWeek!=null) a.push('주간 '+occTxt(r,'Week'));
  if(r.occMonth!=null||r.rmMonth!=null) a.push('월간 '+occTxt(r,'Month'));
  if(r.channels) a.push('예약 경로 '+r.channels);
  if(r.priceWeekday!=null) a.push('주중 '+won(r.priceWeekday));
  if(r.priceWeekend!=null) a.push('주말 '+won(r.priceWeekend));
  if(r.cancel) a.push('취소 '+r.cancel);
  if(r.guests) a.push('손님 '+r.guests);
  if(r.busy) a.push('바쁜 때 '+r.busy);
  if(r.waiting) a.push('예약·웨이팅 '+r.waiting);
  if(r.delivery) a.push('배달·포장 '+r.delivery);
  if(r.bestMenu) a.push('인기 메뉴 '+r.bestMenu);
  if(r.reviewCount!=null) a.push('리뷰 '+r.reviewCount);

  return a;
}

function recalcOcc(){
  const g = i => (document.getElementById(i)||{}).value||'';
  const rooms = numOrNull(g('r_rooms'));
  const dn = denoms(rooms, g('r_date')||todayISO());
  [['Today','r_today','실'],['Week','r_week','실박'],['Month','r_month','실박']].forEach(([k,id,unit])=>{
    const box = document.getElementById('c_'+k); if(!box) return;
    const n = numOrNull(g(id)), d = dn[k];
    if(n==null){ box.textContent = d?('/ '+d+unit):'객실 수 입력'; box.className='calcline'; return; }
    if(!d){ box.textContent='객실 수 필요'; box.className='calcline'; return; }
    const p = Math.round(n/d*1000)/10;
    box.textContent = p+'% · '+n+'/'+d+unit;
    box.className = 'calcline' + (p>=100?' full':'');
  });
}
function saveReport(id, siteId, isNew){
  const g = i => (document.getElementById(i)||{}).value||'';
  const t = i => g(i).trim();
  const site = siteById(siteId);
  const food = isFood(site);
  const date = g('r_date')||todayISO();
  const data = { siteId, date, via:reportVia, met:t('r_met'), sales:t('r_sales'),
    trend:reportPick.trend||'', adSat:reportPick.adSat||'', request:t('r_req'), nextVisit:g('r_next'),
    reviewCount:numOrNull(g('r_rev')), rating:numOrNull(g('r_rate')), note:t('r_note') };
  let rooms = null, rm = { Today:null, Week:null, Month:null };
  if(food){
    Object.assign(data, { guests:t('r_guests'), busy:t('r_busy'), waiting:t('r_wait'), delivery:t('r_deliv'), bestMenu:t('r_menu') });
  }else{
    rooms = numOrNull(g('r_rooms'));
    if(site && rooms!=null && rooms !== site.rooms) site.rooms = rooms;   // 객실 수는 업체 정보에도 반영
    const dn = denoms(rooms, date);
    rm = { Today:numOrNull(g('r_today')), Week:numOrNull(g('r_week')), Month:numOrNull(g('r_month')) };
    const pct = k => (rm[k]!=null && dn[k]) ? Math.round(rm[k]/dn[k]*1000)/10 : null;
    Object.assign(data, { rooms, rmToday:rm.Today, rmWeek:rm.Week, rmMonth:rm.Month,
      occToday:pct('Today'), occWeek:pct('Week'), occMonth:pct('Month'),
      occSaid:t('r_occsaid'), channels:t('r_ch'), cancel:t('r_cancel'),
      priceWeekday:numOrNull(g('r_pw')), priceWeekend:numOrNull(g('r_pe')) });
  }
  if(site){
    if(data.nextVisit) site.nextVisit = data.nextVisit;
    // 방문해서 기록한 것이면 최근 방문일도 함께 갱신
    if(isNew && reportVia==='방문' && (!site.lastVisit || date > site.lastVisit)) site.lastVisit = date;
  }
  if(isNew) DB.reports.push(Object.assign({id, ts:Date.now()},data));
  else Object.assign(DB.reports.find(x=>x.id===id), data);
  save(); closeSheet(); render();
  toast(!food && rooms==null && (rm.Today!=null||rm.Week!=null||rm.Month!=null)
    ? '기록했습니다 — 총 객실 수를 넣으면 예약률이 계산됩니다'
    : '현황을 기록했습니다');
}

        <div style="margin-bottom:16px">${ns.slice(0,3).map(n=>`<div class="notecard"><div class="d">${n.at}</div><div class="x">${esc(n.text)}</div></div>`).join('')}</div>`:''; })()}
      ${s.phone?`<div class="btnrow" style="margin:4px 0 16px">
        <a class="btn sm ghost" href="tel:${esc(s.phone)}">전화</a>
        <a class="btn sm ghost" href="sms:${esc(s.phone)}">문자</a>
        ${s.address?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(s.address)}">지도</a>`:''}
      </div>`:''}
      ${oi.length?`<p class="eyebrow">미해결 조치 ${oi.length}건</p>
        <div style="margin-bottom:16px">${oi.map(i=>`<div class="row b-signal"><div class="bar"></div><div class="body"><div class="t">${esc(i.text)}</div><div class="m">${fmtDate(i.createdAt)}</div></div></div>`).join('')}</div>`:''}
      <p class="eyebrow">방문 이력 ${visits.length}회</p>
      ${visits.length?`<div class="tl" style="margin-bottom:16px">${visits.slice(0,12).map(v=>`
        <div class="node">
          <div class="mono" style="font-size:11px;color:var(--brass)">${v.date}</div>
          <div style="font-size:12.5px;color:var(--dim);margin-top:2px">양호 ${v.counts.ok} · 주의 ${v.counts.warn} · 문제 ${v.counts.bad}</div>
          ${v.summary?`<div style="font-size:13px;margin-top:5px">${esc(v.summary)}</div>`:''}
        </div>`).join('')}</div>`:`<p class="sub" style="margin-bottom:16px">아직 방문 기록이 없습니다.</p>`}
    `:''}

    <div class="btnrow" style="margin-top:8px">
      <button class="btn primary" data-savesite="${s.id}" data-new="${isNew?1:0}">저장</button>
      <button class="btn ghost" data-close="1">닫기</button>
    </div>
    ${!isNew?`<p class="eyebrow" style="margin-top:22px">거래처 관리</p>
    <div class="btnrow">
      ${s.ended?`<button class="btn ghost" data-restoresite="${s.id}">다시 거래 중으로</button>`
               :`<button class="btn ghost" data-endsite="${s.id}">계약 종료로 옮기기</button>`}
      <button class="btn danger" data-delsite="${s.id}" style="margin-left:auto">삭제</button>
    </div>
    <div class="hint" style="margin-top:8px">계약 종료로 옮기면 기록은 그대로 보관됩니다. 삭제하면 기록까지 모두 지워집니다.</div>`:''}
  `);
}
function saveSiteFromSheet(id,isNew){
  const g = i => (document.getElementById(i)||{}).value||'';
  const name = g('f_name').trim();
  if(!name){ toast('업체명을 입력해 주세요'); return; }
  const data = { name, type:g('f_type'), cycleDays:Math.max(1,parseInt(g('f_cycle'))||30), rooms:numOrNull(g('f_rooms')),
    manager:g('f_manager').trim(), phone:g('f_phone').trim(), address:g('f_addr').trim(),
    lastVisit:g('f_last'), nextVisit:g('f_next'), contractEnd:g('f_end'), templateId:g('f_tpl'), memo:g('f_memo').trim() };
  if(isNew) DB.sites.push(Object.assign({id},data));
  else Object.assign(siteById(id), data);
  save(); closeSheet(); render();
  toast(isNew?`업체를 등록했습니다 · 현재 ${liveSites().length}곳`:'저장했습니다');
}
function managerOptions(){
  const set = [...new Set(DB.sites.map(x=>(x.manager||'').trim()).filter(Boolean))].sort();
  return set.map(m=>`<option value="${esc(m)}"></option>`).join('');
}

function sheetTemplate(id){
  const t = tplById(id);
  openSheet(`
    <h2>${esc(t.name)}</h2>
    <p class="sub" style="margin-bottom:16px">항목을 지우거나 추가하면 다음 점검부터 반영됩니다.</p>
    ${t.groups.map((g,gi)=>`
      <p class="eyebrow" style="margin-top:18px">${esc(g.name)}</p>
      ${g.items.map((it,ii)=>`<div class="row"><div class="bar"></div>
        <div class="body"><div class="t">${esc(it)}</div></div>
        <button class="end" data-delitem="${t.id}|${gi}|${ii}" style="color:#D8453B">삭제</button></div>`).join('')}
      <div style="margin-top:8px"><button class="btn sm ghost" data-additem="${t.id}|${gi}">항목 추가</button></div>
    `).join('')}
    <div class="btnrow" style="margin-top:22px">
      <button class="btn ghost" data-addgroup="${t.id}">구역 추가</button>
      <button class="btn primary" data-close="1" style="margin-left:auto">닫기</button>

  `);
}

/* ── 시트 · 토스트 ──────────────────── */
function openSheet(html){
  document.getElementById('modalRoot').innerHTML = `<div class="mask" data-mask="1"><div class="sheet">${html}</div></div>`;
}
function closeSheet(){ document.getElementById('modalRoot').innerHTML=''; }
let tt;
function toast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200);
}

/* ── 예시 데이터 ────────────────────── */

  const mk = (name,type,cycle,ago,manager,phone)=>({ id:uid(), name, type, cycleDays:cycle,
    lastVisit: ago===null?'':addDays(t,-ago), manager, phone, address:'', contractEnd:'',

  DB.sites.push(
    mk('예시 · 돌산 오션뷰 펜션','펜션',30,41,'김사장','010-0000-0001'),

    mk('예시 · 향일암 리조트','리조트',45,12,'이과장','010-0000-0003'),
    mk('예시 · 바다 식당','식당',30,20,'최사장','010-0000-0004'),
    mk('예시 · 웅천 카페','카페',30,null,'','')

  DB.issues.push({ id:uid(), siteId:DB.sites[0].id, text:'객실 내부 파손·노후 부위가 있는가',

  DB.issues.push({ id:uid(), siteId:DB.sites[1].id, text:'대표 사진이 현재 시즌과 맞는가',
    note:'겨울 사진이 대표로 걸려 있음. 재촬영 일정 잡기', level:'warn', status:'doing', createdAt:addDays(t,-28) });
  save(); render(); toast('예시 데이터를 넣었습니다');
}

/* ── 이벤트 ─────────────────────────── */
document.addEventListener('click', e=>{
  const el = t => e.target.closest(t);
  let n;

  if(n=el('.rail button')) return go(n.dataset.tab);
  if(n=el('[data-tab]')) return go(n.dataset.tab);

  // 점검 진행
  if(n=el('[data-ans]')){ return answer(n.dataset.ans); }
  if(n=el('[data-run]')){
    const k=n.dataset.run;
    if(k==='prev'){ if(RUN.i>0){ RUN.i--; drawRun(); } }
    else if(k==='next'){ if(RUN.i<RUN.queue.length){ RUN.i++; saveDraft(); drawRun(); } }
    else if(k==='back'){ RUN.i=Math.max(0,RUN.queue.length-1); drawRun(); }
    else if(k==='quit'){ RUN.summary=(document.getElementById('runsummary')||{}).value||RUN.summary; saveDraft(); endRun(); render(); toast('여기까지 저장했습니다'); }
    else if(k==='save'){ commitRun(); }
    return;
  }
  if(n=el('[data-start]')) return startRun(n.dataset.start,null);

  // 시트
  if(el('[data-close]')) return closeSheet();
  if(e.target.dataset.mask) return closeSheet();
  if(n=el('[data-site]')) return sheetSite(siteById(n.dataset.site));
  if(n=el('[data-savesite]')) return saveSiteFromSheet(n.dataset.savesite, n.dataset.new==='1');
  if(n=el('[data-endsite]')){
    const s=siteById(n.dataset.endsite);
    if(s && confirm('「'+s.name+'」을(를) 계약 종료로 옮길까요?\n기록은 그대로 보관되고, 종료 탭에서 언제든 되돌릴 수 있습니다.')){
      s.ended=true; s.endedAt=todayISO();
      if(DB.draft && DB.draft.siteId===s.id) DB.draft=null;
      save(); closeSheet(); render(); toast('종료 탭으로 옮겼습니다');
    }
    return;
  }
  if(n=el('[data-restoresite]')){
    const s=siteById(n.dataset.restoresite);
    if(s){ s.ended=false; s.endedAt=''; save(); closeSheet(); render(); toast('거래 중으로 되돌렸습니다'); }
    return;
  }
  if(n=el('[data-delsite]')){
    if(confirm('이 업체와 관련된 방문 기록·현황·조치·메모가 모두 지워지고 되돌릴 수 없습니다.\n기록을 남기려면 취소하고 「계약 종료로 옮기기」를 쓰세요.\n\n삭제할까요?')){
      const id=n.dataset.delsite;
      DB.sites=DB.sites.filter(s=>s.id!==id);
      DB.visits=DB.visits.filter(v=>v.siteId!==id);
      DB.issues=DB.issues.filter(i=>i.siteId!==id);
      DB.reports=DB.reports.filter(r=>r.siteId!==id);
      DB.notes=DB.notes.filter(nt=>nt.siteId!==id);
      save(); closeSheet(); render(); toast('삭제했습니다');
    }
    return;
  }

  // 조치
  if(n=el('[data-ifilter]')){ issueFilter=n.dataset.ifilter; render(); return; }
  if(n=el('[data-iset]')){
    const i=DB.issues.find(x=>x.id===n.dataset.id);
    if(i){ i.status=n.dataset.iset; if(i.status==='done') i.closedAt=todayISO(); else delete i.closedAt; save(); render(); }
    return;
  }
  if(n=el('[data-iedit]')){
    const i=DB.issues.find(x=>x.id===n.dataset.iedit);
    const v=prompt('메모', i.note||''); if(v!==null){ i.note=v.trim(); save(); render(); }
    return;
  }
  if(n=el('[data-issue]')){ issueFilter='open'; go('issues'); return; }

  // 템플릿
  if(n=el('[data-tpl]')) return sheetTemplate(n.dataset.tpl);
  if(n=el('[data-delitem]')){
    const [id,gi,ii]=n.dataset.delitem.split('|');
    tplById(id).groups[+gi].items.splice(+ii,1); save(); sheetTemplate(id); return;
  }
  if(n=el('[data-additem]')){
    const [id,gi]=n.dataset.additem.split('|');
    const v=prompt('점검 항목을 입력하세요'); if(v&&v.trim()){ tplById(id).groups[+gi].items.push(v.trim()); save(); sheetTemplate(id); }
    return;
  }
  if(n=el('[data-addgroup]')){
    const v=prompt('구역 이름 (예: 주차장)'); if(v&&v.trim()){ tplById(n.dataset.addgroup).groups.push({name:v.trim(),items:[]}); save(); sheetTemplate(n.dataset.addgroup); }
    return;
  }

  // 현황 · 메모
  if(n=el('[data-via]')){
    reportVia = n.dataset.via;
    n.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===n));
    return;
  }
  if(n=el('[data-pick]')){
    const k=n.dataset.pick, v=n.dataset.val;
    reportPick[k] = (reportPick[k]===v) ? '' : v;      // 한 번 더 누르면 선택 해제
    n.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.val===reportPick[k]));
    return;
  }
  if(n=el('[data-report]')) return sheetReport(n.dataset.report, null);
  if(n=el('[data-editrep]')){
    const r=DB.reports.find(x=>x.id===n.dataset.editrep);
    if(r) sheetReport(r.siteId, r);
    return;
  }
  if(n=el('[data-savereport]')) return saveReport(n.dataset.savereport, n.dataset.rsite, n.dataset.newrep==='1');
  if(n=el('[data-delreport]')){
    if(confirm('이 현황 기록을 삭제할까요?')){
      DB.reports=DB.reports.filter(x=>x.id!==n.dataset.delreport);
      save(); closeSheet(); render(); toast('삭제했습니다');
    }
    return;
  }
  if(n=el('[data-hist]')) return sheetHistory(n.dataset.hist);
  if(n=el('[data-note]')) return sheetNote(n.dataset.note);
  if(n=el('[data-savenote]')){
    const t=(document.getElementById('n_text')||{}).value||'';
    if(!t.trim()){ toast('내용을 입력해 주세요'); return; }
    DB.notes.push({ id:uid(), siteId:n.dataset.savenote, text:t.trim(), at:todayISO(), ts:Date.now() });
    save(); closeSheet(); render(); toast('메모를 저장했습니다');
    return;
  }
  if(n=el('[data-delnote]')){
    const id=n.dataset.delnote, note=DB.notes.find(x=>x.id===id);
    if(note && confirm('이 메모를 삭제할까요?')){
      const sid=note.siteId;
      DB.notes=DB.notes.filter(x=>x.id!==id);
      save(); sheetHistory(sid);
    }
    return;
  }

  // 기타 동작
  if(n=el('[data-act]')){
    const a=n.dataset.act;
    if(a==='newsite') sheetSite(null);
    else if(a==='demo'){ if(DB.sites.length && !confirm('예시 업체 5곳을 추가합니다. 계속할까요?')) return; seedDemo(); }
    else if(a==='resume') startRun(DB.draft.siteId, DB.draft);
    else if(a==='dropdraft'){ DB.draft=null; save(); render(); }
    else if(a==='export'){
      const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob), link=document.createElement('a');
      link.href=url; link.download='거래처관리-백업-'+todayISO()+'.json'; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    else if(a==='import'){
      const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
      inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=()=>{ try{ DB=normalize(JSON.parse(r.result)); save(); render(); toast('가져왔습니다'); }
                       catch(err){ toast('파일을 읽지 못했습니다'); } };
        r.readAsText(f); };
      inp.click();
    }
    return;
  }
});

document.addEventListener('change', e=>{
  if(e.target && e.target.dataset && e.target.dataset.calc !== undefined) recalcOcc();
  if(e.target && e.target.id==='f_type'){            // 업종을 바꾸면 객실 수 칸과 점검표를 맞춰 준다
    const w=document.getElementById('w_rooms'); if(w) w.style.display = FOOD_TYPES.includes(e.target.value)?'none':'';
    const tp=document.getElementById('f_tpl'); if(tp) tp.value = tplForType(e.target.value);
  }
});
document.addEventListener('input', e=>{
  if(e.target && e.target.dataset && e.target.dataset.calc !== undefined) recalcOcc();
  if(e.target && e.target.dataset && e.target.dataset.phone !== undefined){
    const v = formatPhone(e.target.value);
    if(v !== e.target.value) e.target.value = v;
  }
});

DB = loadLocal();
render();
initSync();
if(DB.draft) setTimeout(()=>toast('진행 중이던 점검이 있습니다 — 점검 탭에서 이어서 하세요'),600);
</script>
